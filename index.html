<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Image Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Responsive Image Gallery</h1>

<!-- Filter Buttons -->
<div class="filters">
  <button class="active" data-filter="all">All</button>
  <button data-filter="nature">Nature</button>
  <button data-filter="city">City</button>
  <button data-filter="animals">Animals</button>
</div>

<!-- Gallery -->
<div class="gallery">
  <img src="https://picsum.photos/id/1015/600/400" data-category="nature">
  <img src="https://picsum.photos/id/1016/600/400" data-category="nature">
  <img src="https://picsum.photos/id/1018/600/400" data-category="nature">

  <img src="https://picsum.photos/id/1024/600/400" data-category="animals">
  <img src="https://picsum.photos/id/1025/600/400" data-category="animals">
  <img src="https://picsum.photos/id/1062/600/400" data-category="animals">

  <img src="https://picsum.photos/id/1031/600/400" data-category="city">
  <img src="https://picsum.photos/id/1035/600/400" data-category="city">
  <img src="https://picsum.photos/id/1043/600/400" data-category="city">

  <img src="https://picsum.photos/id/1050/600/400" data-category="nature">
  <img src="https://picsum.photos/id/1057/600/400" data-category="city">
  <img src="https://picsum.photos/id/1074/600/400" data-category="animals">
</div>

<!-- Lightbox -->
<div class="lightbox">
  <span class="close">&times;</span>
  <button class="prev">&#10094;</button>
  <img class="lightbox-img">
  <button class="next">&#10095;</button>
</div>

<script src="script.js"></script>
</body>
</html>
